name: Tests

# Module-wise PR test runner.
#
# Each `test` job runs an isolated subset of the test tree (data, domain,
# gateway, features, integration) so a failure pinpoints WHICH layer
# regressed — no scrolling through one giant log. Jobs run in parallel; the
# `setup` job builds the pub-cache + codegen once and shares it via the
# upload-artifact / download-artifact pair so every downstream job is just
# `flutter test <paths>` against a warm tree.
#
# Trigger:
#   - PRs into `main` (any branch).
#   - Pushes to `main` (smoke-test the merge result; matches branch protection).
#   - Manual dispatch (debug, rerun a single shard).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same PR when new commits land — saves
# Actions minutes and avoids stale-result noise on the PR.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  # ── Setup: pub get + codegen, shared across every test shard ─────────────
  setup:
    name: Setup (pub get + codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: build_runner (freezed + isar + injectable + json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # Upload the generated `.dart_tool/`, `.g.dart`, `.freezed.dart` files
      # plus the resolved pub-cache so test jobs don't redo this work.
      - name: Upload tree
        uses: actions/upload-artifact@v4
        with:
          name: built-tree
          path: |
            .dart_tool/
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            test/**/*.g.dart
            test/**/*.freezed.dart
          if-no-files-found: warn
          retention-days: 1

  # ── Static analysis (fast, runs in parallel with the test shards) ────────
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: built-tree
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos lib/ test/

  # ── Test matrix — one job per module ─────────────────────────────────────
  test:
    name: ${{ matrix.module.label }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      # `fail-fast: false` lets every shard report independently so a flake
      # in one module doesn't mask real failures in another.
      fail-fast: false
      matrix:
        module:
          # Order is informational only — every job runs in parallel.
          - label: data — models
            paths: test/data/models
          - label: data — repositories
            paths: test/data/repositories
          - label: data — datasources
            paths: test/data/datasources
          - label: domain — usecases
            paths: test/domain
          - label: gateway — inbound
            paths: test/gateway/inbound
          - label: gateway — subscriptions
            paths: test/gateway/subscriptions
          - label: features — brahma
            paths: test/features/brahma
          - label: features — shiv
            paths: test/features/shiv
          - label: features — vishnu
            paths: test/features/vishnu
          - label: features — other
            # Catch-all for anything under test/features/ not listed above.
            # Adjust the exclude list when a new feature gets its own row.
            paths: test/features
            exclude: |
              test/features/brahma
              test/features/shiv
              test/features/vishnu
          - label: integration
            paths: test/integration
          - label: common + root
            # Top-level test files (`test/*.dart`) + shared widgets.
            paths: test/common test/widget_test.dart test/shiv_home_page_test.dart test/expandable_note_text_tap_test.dart test/llm_text_sanitizer_test.dart

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: built-tree

      - name: flutter pub get
        run: flutter pub get

      - name: Run tests
        # `--reporter expanded` gives per-test PASS/FAIL lines so the GitHub
        # log surfaces the exact failure without you needing to download a
        # report file. `--concurrency=4` matches a standard 2-vCPU runner.
        run: |
          set -e
          # Skip paths that don't exist in the tree yet (new module rows
          # land before their first test does).
          existing=""
          for p in ${{ matrix.module.paths }}; do
            if [ -e "$p" ]; then
              existing="$existing $p"
            fi
          done
          if [ -z "$existing" ]; then
            echo "::notice::No tests found for module ${{ matrix.module.label }} — skipping."
            exit 0
          fi
          flutter test --reporter expanded --concurrency=4 $existing

  # ── Summary gate for branch protection ───────────────────────────────────
  # Branch-protect `tests` so a PR can't merge until every shard above
  # passes. This job aggregates the matrix into a single required check —
  # GitHub doesn't let you require a matrix expansion directly.
  tests-passed:
    name: tests
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more test shards failed."
            exit 1
          fi
          echo "All shards passed."
