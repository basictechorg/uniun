org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Some third-party Flutter plugins (e.g. receive_sharing_intent) compile their
# Java at 1.8 while their Kotlin targets 17/21; AGP+Kotlin treat that per-module
# mismatch as an error by default. Downgrade to a warning so those plugins build
# — our own :app module is consistently 17/17 and unaffected.
kotlin.jvm.target.validation.mode=warning
