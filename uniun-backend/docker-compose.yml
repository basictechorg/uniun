# Admin sets secrets via shell env or a .env file in this directory.
# Required: AZURE_STORAGE_ACCOUNT_KEY. All else has sensible defaults.

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: uniun-relay:latest
    container_name: uniun-relay
    restart: unless-stopped

    # Loopback only — nginx terminates TLS on 8080 and proxies to 8082.
    # The relay must NEVER be publicly reachable on 8082.
    ports:
      - "127.0.0.1:8082:8082"

    # ./db is a bind-mount so the PM2 → Docker cutover is zero-data-
    # movement (same files PM2 was already using). Logs use a named
    # volume so docker auto-inherits the nonroot ownership baked into
    # the image — no manual mkdir/chown on the host.
    volumes:
      - ./db:/data/db
      - uniun-logs:/data/logs

    environment:
      RELAY_BIND: "0.0.0.0"
      RELAY_PORT: "8082"
      RELAY_URL: "${RELAY_URL:-wss://dev.uniun.in:8080}"

      WORKING_DIR: "/data"
      MYSQL_DSN: "${MYSQL_DSN:-}"

      RELAY_NAME: "${RELAY_NAME:-Uniun Relay}"
      RELAY_DESCRIPTION: "${RELAY_DESCRIPTION:-Uniun social relay}"
      RELAY_CONTACT: "${RELAY_CONTACT:-}"
      RELAY_PUBKEY: "${RELAY_PUBKEY:-}"
      RELAY_ICON: "${RELAY_ICON:-}"
      RELAY_BANNER: "${RELAY_BANNER:-}"

      AZURE_FOR_BLOSSOM: "${AZURE_FOR_BLOSSOM:-true}"
      AZURE_STORAGE_ACCOUNT_NAME: "${AZURE_STORAGE_ACCOUNT_NAME:-uniun}"
      # No default — empty substitution surfaces a clear runtime error
      # rather than silently attempting anon access.
      AZURE_STORAGE_ACCOUNT_KEY: "${AZURE_STORAGE_ACCOUNT_KEY}"
      AZURE_BLOSSOM_CONTAINER: "${AZURE_BLOSSOM_CONTAINER:-blossom}"

      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # zerolog tees to stderr too, so `docker logs uniun-relay` keeps working.
      LOG_FILE: "/data/logs/uniun.log"

    read_only: true
    tmpfs:
      - /tmp:size=16M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  uniun-logs:
