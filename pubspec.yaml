name: uniun
description: "UNIUN — decentralized offline-first social and knowledge network on Nostr."
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.11.0 <4.0.0"

global_options:
  freezed:freezed:
    runs_before:
      - isar_generator:isar_generator

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.2
  go_router: ^14.0.0
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  bloc_concurrency: ^0.2.4
  injectable: ^2.3.2
  get_it: ^8.0.0
  freezed_annotation: ^3.0.0
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  dartz: ^0.10.1
  path_provider: ^2.0.15
  path: ^1.9.0
  web_socket_channel: ^3.0.3
  convert: ^3.1.2
  crypto: ^3.0.7
  nostr: ^1.4.0
  nostr_core_dart: ^1.0.1
  json_annotation: ^4.9.0
  flutter_secure_storage: any
  shared_preferences: ^2.2.2
  avatar_plus: ^0.0.5
  cached_network_image: ^3.3.1
  image_picker: ^1.2.1
  flutter_native_splash: ^2.3.10
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  mobile_scanner: ^7.2.0
  flutter_gemma: ^0.16.5
  system_info_plus: ^0.0.6
  openmls: ^1.3.0
  http: ^1.4.0
  uuid: ^4.5.1
  graphview: ^1.5.1
  flutter_keyboard_visibility: ^6.0.0
  nip44:
    git:
      url: https://github.com/chebizarro/dart-nip44.git
      ref: master
  disk_space_plus: ^0.2.6
  nip77: ^1.0.1
  flutter_svg: ^2.2.4
  tostore: ^3.1.0
  visibility_detector: ^0.4.0+2
  openrouter_api: ^1.0.2
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.0
  url_launcher: ^6.3.0
  flutter_blurhash: ^0.9.1
  mime: ^2.0.0
  file_picker: ^8.1.4
  # Native image compression (Android / iOS / macOS / web). Windows is the
  # one gap — ImageCompressor short-circuits on Windows and the picker uses
  # the larger `kMaxUploadBytesWindows` cap so users can still send photos
  # at their native size on desktop Windows.
  flutter_image_compress: ^2.3.0
  open_filex: ^4.5.0
  # Native video compression (Android MediaCodec / iOS AVFoundation /
  # macOS). Same Windows-gap pattern as flutter_image_compress —
  # VideoCompressor short-circuits on Windows and the picker enforces the
  # 50 MB binary cap directly; users on Windows have to shrink videos
  # externally before sending.
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.13.0
  freezed: ^3.0.0
  isar_community_generator: 3.3.2
  injectable_generator: ^2.4.1
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/uniun-logo.png

  android_12:
    image: assets/images/uniun-logo-android12.png
    color: "#ffffff"

  ios: true
  ios_content_mode: center
  android_gravity: center

  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/uniun-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/uniun-logo.png"

# nostr_core_dart ^1.0.1 declares http ^0.13.3, but flutter_gemma ^0.13.1 needs
# http ^1.4.0 via grpc. nostr_core_dart only calls http.get(Uri.parse(...)) so
# it is fully compatible with http 1.x at runtime — safe to override.
dependency_overrides:
  http: ^1.4.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tabs/
    - assets/models/embedding/
